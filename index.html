  '</article>';
 }).join('');
 const f=modal('Продажа комплектующих','<p class="mu kit-help">Выберите детали, укажите количество и цену продажи. Источник и доступный остаток показаны в каждой карточке.</p><div class="sell-items">'+rows+'</div><div class="g2"><label>Дата продажи<input name="date" type="date" value="'+today()+'" required></label><label>Зачислить выручку в кассу<select name="acc">'+accOpt()+'</select></label></div><div class="sell-summary" id="sell-total">Выберите позиции для расчёта суммы и прибыли.</div>',form=>{

 }

function shrink(fl){

  if(!fl||typeof fl!=='object'||typeof fl.size!=='number'||fl.size<=0){
   reject(new Error('Выбран пустой или некорректный файл.'));
   return;
  }
  if(fl.type&&!/^image\//i.test(fl.type)){
   reject(new Error('Выберите файл изображения.'));
   return;
  }
  let objectUrl='',settled=false;
  const image=new Image();
  const finish=(error,value)=>{
   if(settled)return;
   settled=true;
   if(objectUrl){try{URL.revokeObjectURL(objectUrl)}catch(_){}}
   if(error)reject(error);else resolve(value);
  };
  image.onload=()=>{
   try{
    const width=Number(image.naturalWidth||image.width),height=Number(image.naturalHeight||image.height);
    if(!Number.isFinite(width)||!Number.isFinite(height)||width<=0||height<=0){
     throw new Error('У изображения не удалось определить размеры.');
    }
    const scale=Math.min(1,1100/Math.max(width,height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(width*scale));
    canvas.height=Math.max(1,Math.round(height*scale));
    const context=canvas.getContext('2d');
    if(!context)throw new Error('Браузер не смог подготовить изображение для сжатия.');
    context.fillStyle='#fff';
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    const result=canvas.toDataURL('image/jpeg',.75);
    if(!/^data:image\/jpeg;base64,/.test(result))throw new Error('Браузер не смог сжать изображение.');
    finish(null,result);
   }catch(error){finish(error instanceof Error?error:new Error('Не удалось обработать изображение.'))}
  };
  image.onerror=()=>finish(new Error('Файл не удалось открыть как изображение. Проверьте файл и попробуйте другой.'));
  try{
   objectUrl=URL.createObjectURL(fl);
   image.src=objectUrl;
  }catch(error){finish(error instanceof Error?error:new Error('Не удалось прочитать выбранное изображение.'))}
 });
}

const QN=['Важно и срочно','Важно, но не срочно','Срочно, но не важно','Не важно и не срочно','По желанию'];
const taskCompletedDate=task=>{
 const raw=task&&(task.doneAt||task.updatedAt||task.createdAt);
 const value=typeof raw==='string'?raw.slice(0,10):'';
 return /^\d{4}-\d{2}-\d{2}$/.test(value)?value:today();
};
const taskDateAge=completedDate=>{
 const parse=value=>{const parts=String(value||'').split('-').map(Number);return parts.length===3&&parts.every(Number.isFinite)?Date.UTC(parts[0],parts[1]-1,parts[2]):NaN};
 const end=parse(today()),start=parse(completedDate);
 return Number.isFinite(start)&&Number.isFinite(end)?Math.floor((end-start)/86400000):0;
};
function archiveOldCompletedTasks(){
 let changed=false;
 (Array.isArray(S.tasks)?S.tasks:[]).forEach(task=>{
  if(!task.done){
   if(task.archivedAt){delete task.archivedAt;changed=true}
   return;
  }
  if(task.archivedAt)return;
  if(taskDateAge(taskCompletedDate(task))>2){task.archivedAt=today();changed=true}
 });
 if(changed){save.skip=1;save()}
 return changed;
}

const JOURNAL_COLLECTION_LABELS={accounts:'Кассы',batches:'Склад',builds:'Сборки',tx:'Операции',tasks:'Задачи',checklist:'Чек-лист',debts:'Долги',investments:'Инвестиции',salesPlans:'Планы продаж',stockEvents:'События склада',trash:'Корзина',categories:'Категории',hiddenCategories:'Скрытые категории',hiddenGroups:'Скрытые группы'};
const JOURNAL_FIELD_LABELS={name:'Название',status:'Статус',builder:'Сборщик',buyer:'Покупатель',date:'Дата',sold:'Дата продажи',planned:'Плановая цена',price:'Цена',cost:'Себестоимость',lines:'Комплектующие',qty:'Количество',type:'Тип',desc:'Описание',supplier:'Поставщик',link:'Ссылка',note:'Комментарий',problemQty:'Проблемные единицы',writtenOffQty:'Списано единиц',problemReason:'Причина проблемы',text:'Текст задачи',q:'Приоритет',due:'Срок',dueDate:'Срок возврата',who:'Исполнитель',build:'Связанная сборка',buildId:'ID сборки',done:'Выполнено',doneAt:'Дата выполнения',archivedAt:'Дата архивации',amount:'Сумма',cat:'Категория',grp:'Группа',acc:'Касса',fromAcc:'Касса отправления',toAcc:'Касса получения',open:'Начальный остаток',currentValue:'Текущая оценка',principal:'Сумма долга',platform:'Площадка / брокер',direction:'Направление',person:'Контрагент',accountId:'Касса',targetQty:'Плановое количество',targetAmount:'Плановая выручка',month:'Месяц',metric:'Показатель',scope:'Область плана',category:'Категория',product:'Модель',kind:'Тип операции',unitCost:'Себестоимость за штуку',unitPrice:'Цена за штуку',grossProfit:'Валовая прибыль',costAmount:'Себестоимость продажи'};
const JOURNAL_META_FIELDS=new Set(['createdAt','updatedAt','deletedAt','schemaVersion']);
function journalEntityCaption(collection,record,selector){
 if(collection==='lines'){
  const part=record&&S.batches.find(x=>x.id==record.batchId);
  return part?'Деталь «'+(part.type?part.type+' — ':'')+part.desc+'»':'Деталь '+String(record&&record.batchId||selector&&selector.value||'без ID');
 }
 if(!record)return selector&&selector.value?'Запись '+selector.value:'Запись';
 if(collection==='builds')return 'Сборка №'+(record.num||'?')+(record.name?' «'+record.name+'»':'');
 if(collection==='batches')return 'Партия «'+[record.type,record.desc].filter(Boolean).join(' — ')+'»';
 if(collection==='tasks')return 'Задача «'+(record.text||'без названия')+'»';
 if(collection==='tx')return 'Операция «'+(record.desc||record.cat||record.kind||'без описания')+'»';
 if(collection==='accounts')return 'Касса «'+(record.name||'без названия')+'»';
 if(collection==='debts')return 'Долг «'+(record.person||'без контрагента')+'»';
 if(collection==='investments')return 'Инвестиция «'+(record.name||'без названия')+'»';
 if(collection==='checklist')return 'Пункт «'+(record.text||'без названия')+'»';
 if(collection==='salesPlans')return 'План на '+(record.month||'неизвестный месяц');
 if(collection==='stockEvents')return 'Складское событие «'+(record.batchDesc||record.kind||'')+'»';
 return JOURNAL_COLLECTION_LABELS[collection]||collection;
}
function journalReadablePath(change){
 const path=Array.isArray(change&&change.path)?change.path:[];
 const parts=[];
 for(let i=0;i<path.length;i++){
  const segment=path[i];
  if(i===0&&typeof segment==='string'){parts.push(JOURNAL_COLLECTION_LABELS[segment]||segment);continue}
  if(segment&&segment.__journalSelector){
   const found=journalRead(S,path.slice(0,i+1));
   const record=found.exists?found.value:(i===path.length-1?(change.afterExists?change.afterValue:change.beforeValue):null);
   parts.push(journalEntityCaption(String(path[i-1]||''),record,segment));
   continue;
  }
  if(typeof segment==='string'){
   if(path[i-1]==='categories'&&(segment==='e'||segment==='i'))parts.push(segment==='e'?'Расходы':'Доходы');
   else if(path[i-1]==='e'||path[i-1]==='i')parts.push('Группа «'+segment+'»');
   else parts.push(JOURNAL_FIELD_LABELS[segment]||segment);
  }else parts.push(String(segment));
 }
 return parts.join(' → ')||'Данные профиля';
}
function journalNumber(value){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(value)}
function journalFormatValue(value,key){
 if(value===undefined||value===null||value==='')return '—';
 if(typeof value==='boolean')return value?'Да':'Нет';
 if(typeof value==='number'){
  if(['amount','price','planned','cost','open','currentValue','principal','targetAmount','grossProfit','unitCost','unitPrice','costAmount'].includes(key))return R(value);
  if(['qty','problemQty','writtenOffQty','targetQty'].includes(key))return journalNumber(value)+' шт.';
  if(key==='q')return QN[+value]||String(value);
  return journalNumber(value);
 }
 if(key==='q'&&Number.isInteger(+value))return QN[+value]||String(value);
 if(key==='kind'){
  const kinds={e:'Расход',i:'Доход',transfer:'Перевод между кассами',loan_in:'Получение займа',loan_out:'Выдача долга',loan_repayment_in:'Возврат долга',loan_repayment_out:'Погашение долга',investment_in:'Вывод из инвестиции',investment_out:'Вложение в инвестицию'};
  return kinds[value]||String(value);
 }
 if(['date','sold','due','dueDate'].includes(key)&&/^\d{4}-\d{2}-\d{2}$/.test(String(value)))return D(value);
 if(['acc','fromAcc','toAcc','accountId'].includes(key)){
  const account=S.accounts.find(x=>x.id===value);if(account)return account.name;
 }
 if(['build','buildId','sourceBuildId'].includes(key)){
  const build=S.builds.find(x=>x.id===value);if(build)return 'ПК №'+build.num+(build.name?' — '+build.name:'');
 }
 if(key==='lines'&&Array.isArray(value)){
  return value.map(line=>{const part=S.batches.find(x=>x.id===line.batchId);return '• '+(part?[part.type,part.desc].filter(Boolean).join(' — '):'Партия '+line.batchId)+' × '+line.qty+' шт.'+(line.problem?' (проблемная)':'')}).join('\n')||'Нет комплектующих';
 }
 if(Array.isArray(value))return value.map(item=>typeof item==='string'?item:JSON.stringify(item)).join('\n');
 if(typeof value==='object'){
  try{return JSON.stringify(value,null,2)}catch(_){return '[объект]'}
 }
 return String(value);
}
function journalRecordDetails(record){
 if(!record||typeof record!=='object')return '';
 return Object.entries(record).filter(([key])=>key!=='id'&&!JOURNAL_META_FIELDS.has(key)).map(([key,value])=>'  '+(JOURNAL_FIELD_LABELS[key]||key)+': '+journalFormatValue(value,key)).join('\n');
}
function journalReadableChange(change){
 const path=Array.isArray(change&&change.path)?change.path:[],last=path[path.length-1];
 if(last&&last.__journalSelector){
  const collection=String(path[path.length-2]||''),record=change.afterExists?change.afterValue:change.beforeValue,caption=journalEntityCaption(collection,record,last);
  if(!change.beforeExists)return 'Добавлено: '+caption+(journalRecordDetails(record)?'\n'+journalRecordDetails(record):'');
  if(!change.afterExists)return 'Удалено: '+caption+(journalRecordDetails(record)?'\n'+journalRecordDetails(record):'');
  return 'Изменена запись: '+caption+'\n'+journalRecordDetails(record);
 }
 const key=typeof last==='string'?last:'',label=journalReadablePath(change);
 return label+'\n  Было: '+(change.beforeExists?journalFormatValue(change.beforeValue,key):'— (поля не было)')+'\n  Стало: '+(change.afterExists?journalFormatValue(change.afterValue,key):'— (поле удалено)');
}
function journalVisibleChanges(entry){
 return (entry&&Array.isArray(entry.changes)?entry.changes:[]).filter(change=>!(change.path||[]).some(segment=>typeof segment==='string'&&JOURNAL_META_FIELDS.has(segment)));
}
function journalChangesText(entry){
 const changes=journalVisibleChanges(entry);
 if(!changes.length)return (entry&&entry.changes&&entry.changes.length)?'Обновлены только служебные отметки записи.':'Подробности изменения для этой старой записи не сохранены.';
 return changes.map((change,index)=>(index+1)+'. '+journalReadableChange(change)).join('\n\n');
}
function journalActionLabel(changes,fallback){
 const visible=(changes||[]).filter(change=>!(change.path||[]).some(segment=>typeof segment==='string'&&JOURNAL_META_FIELDS.has(segment)));
 if(!visible.length)return fallback||'Изменение данных';
 const first=visible[0],last=first.path&&first.path[first.path.length-1];
 if(last&&last.__journalSelector){
  const collection=String(first.path[first.path.length-2]||''),record=first.afterExists?first.afterValue:first.beforeValue,caption=journalEntityCaption(collection,record,last);
  if(!first.beforeExists)return 'Добавлена запись: '+caption;
  if(!first.afterExists)return 'Удалена запись: '+caption;
 }
 return visible.length===1?'Изменены данные: '+journalReadablePath(first):'Изменены данные ('+visible.length+' полей)';
}

 const lastDay=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
 date.setDate(Math.max(1,Math.min(lastDay,Math.round(Number(day)||1))));
 return localDateISO(date);
}
function demoShiftDate(value,days){

function demoStamp(date){

function removeDemoData(){
 const collections=['accounts','batches','builds','tx','debts','investments','stockEvents','salesPlans','tasks','checklist','trash'];
 const hasDemo=collections.some(key=>(S[key]||[]).some(item=>item&&(item.demo||(key==='trash'&&item.record&&item.record.demo))))||(LOG||[]).some(item=>item&&item.demo)||String(S.notes||'').includes('— Демо-данные Buildbook —');

 if(!confirm('Удалить демонстрационные записи за полгода? Обычные данные останутся. Записи, на которые уже ссылаются ваши реальные операции, сборки или задачи, будут сохранены.'))return;

 const keepBatchIds=new Set(),keepBuildIds=new Set(),keepDebtIds=new Set(),keepInvestmentIds=new Set(),keepTxIds=new Set(),keepAccountIds=new Set();
 (S.tx||[]).filter(item=>!item.demo).forEach(tx=>{
  if(tx.batchId)keepBatchIds.add(tx.batchId);
  if(tx.buildId)keepBuildIds.add(tx.buildId);
  if(tx.sourceBuildId)keepBuildIds.add(tx.sourceBuildId);
  if(tx.debtId)keepDebtIds.add(tx.debtId);
  if(tx.investmentId)keepInvestmentIds.add(tx.investmentId);
  [tx.acc,tx.fromAcc,tx.toAcc].filter(Boolean).forEach(id=>keepAccountIds.add(id));
 });
 (S.builds||[]).filter(item=>!item.demo).forEach(build=>(build.lines||[]).forEach(line=>keepBatchIds.add(line.batchId)));
 (S.tasks||[]).filter(item=>!item.demo&&item.build).forEach(task=>keepBuildIds.add(task.build));
 (S.stockEvents||[]).filter(item=>!item.demo&&item.batchId).forEach(item=>keepBatchIds.add(item.batchId));
 (S.trash||[]).filter(item=>!item.demo&&!(item.record&&item.record.demo)).forEach(entry=>{
  const record=entry.record||{};
  if(entry.type==='batch'&&record.id)keepBatchIds.add(record.id);
  if(entry.type==='build'&&record.id){keepBuildIds.add(record.id);if(record.txId)keepTxIds.add(record.txId);(record.lines||[]).forEach(line=>keepBatchIds.add(line.batchId))}
  if(entry.type==='task'&&record.build)keepBuildIds.add(record.build);
  if(entry.type==='tx'){
   if(record.batchId)keepBatchIds.add(record.batchId);
   if(record.buildId)keepBuildIds.add(record.buildId);
   if(record.sourceBuildId)keepBuildIds.add(record.sourceBuildId);
   if(record.debtId)keepDebtIds.add(record.debtId);
   if(record.investmentId)keepInvestmentIds.add(record.investmentId);
   [record.acc,record.fromAcc,record.toAcc].filter(Boolean).forEach(id=>keepAccountIds.add(id));
  }
 });
 (S.debts||[]).filter(item=>!item.demo).forEach(debt=>{
  if(debt.accountId)keepAccountIds.add(debt.accountId);
  (debt.payments||[]).forEach(payment=>{if(payment.accountId)keepAccountIds.add(payment.accountId)});
 });
 (S.investments||[]).filter(item=>!item.demo).forEach(investment=>{
  if(investment.accountId)keepAccountIds.add(investment.accountId);
  (investment.events||[]).forEach(event=>{if(event.accountId)keepAccountIds.add(event.accountId)});
 });

 (S.builds||[]).filter(item=>keepBuildIds.has(item.id)).forEach(build=>{
  if(build.txId)keepTxIds.add(build.txId);

function parseCsv(raw){
 const text=String(raw||'').replace(/^\uFEFF/,'');
 let delimiter=';',quote=false,counts={';':0,',':0,'\t':0};
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(ch=='"'){if(quote&&text[i+1]=='"'){i++;continue}quote=!quote;continue}
  if(!quote&&(ch==';'||ch==','||ch=='\t'))counts[ch]++;
  if(!quote&&(ch=='\n'||ch=='\r'))break;
 }
 delimiter=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||';';
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(quoted){
   if(ch=='"'&&text[i+1]=='"'){cell+='"';i++}
   else if(ch=='"')quoted=false;
   else cell+=ch;
  }else if(ch=='"')quoted=true;
  else if(ch==delimiter){row.push(cell);cell=''}
  else if(ch=='\n'){row.push(cell.replace(/\r$/,''));if(row.some(v=>String(v).trim()!==''))rows.push(row);row=[];cell=''}
  else if(ch=='\r'&&text[i+1]=='\n'){}
  else cell+=ch;
 }
 row.push(cell.replace(/\r$/,''));
 if(row.some(v=>String(v).trim()!==''))rows.push(row);
 return rows;
}

 if(raw==='')return NaN;
 const n=Number(raw);return Number.isFinite(n)?n:NaN;
};
function csvDate(value){
 const s=String(value??'').trim();if(!s)return'';
 if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
 let m=/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/.exec(s);
 if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
 if(/^\d{5}(\.\d+)?$/.test(s)){
  const n=Number(s);if(n>20000&&n<100000)return new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000).toISOString().slice(0,10);
 }
 return'';
}

function applyCsvImport(matrix,kind,mapping,defaultKind){

  return String(row[Number(index)]??'').trim();
 };
 const fail=(rowNo,reason)=>{stats.skipped++;if(stats.errors.length<20)stats.errors.push({row:rowNo,reason})};
 for(let ri=0;ri<data.length;ri++){
  const row=data[ri];if(!row||!row.some(v=>String(v??'').trim()!==''))continue;

    if(!Number.isInteger(bad)||!Number.isInteger(off)||bad<0||off<0||bad+off>qty)throw new Error('Проблемное и списанное количество должно быть целым и не превышать количество партии.');
    S.batches.push({id,type,desc,date,price,qty,supplier:value(row,'supplier'),link:value(row,'link'),note:value(row,'note'),problemQty:bad,problemReason:value(row,'problemReason'),writtenOffQty:off});
    stats.added++;
   }else if(kind=='builds'){
    const sourceId=value(row,'id'),id=sourceId||uid();

     rawLines.split(/[|;]/).map(x=>x.trim()).filter(Boolean).forEach(token=>{

      const bucket=problem?'problem':'normal',available=problem?problemAvailable(batch):goodAvailable(batch);

      if(pending[bucket][batchId]>available)throw new Error('Недостаточно '+(problem?'проблемных':'нормальных')+' деталей для строки состава: '+batch.desc);
      const found=lines.find(l=>l.batchId==batchId&&!!l.problem==problem);
      if(found)found.qty+=qty;else lines.push({batchId,qty,problem});
     });
    }

function validBackup(data){

}

}
function triggerFileDownload(blob,filename){

 try{
  link.href=url;link.download=filename;link.click();
 }catch(error){
  URL.revokeObjectURL(url);
  throw error;
 }
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function downloadBackup(filename,markDate){
 try{
  const backupAt=markDate?new Date().toLocaleString('ru-RU'):null;
  const snapshot=createBackupSnapshot(backupAt);
  const blob=new Blob([JSON.stringify(snapshot)],{type:'application/json'});
  completeBackupExport(blob,filename,backupAt);
  return true;
 }catch(error){
  alert('Не удалось создать резервную копию: '+(error&&error.message||'ошибка'));
  return false;
 }
}

function guessXlsxKind(sheetName,headers){

 if(name.includes('инвест')||name.includes('investment'))return'investments';
 if(name.includes('склад')||name.includes('stock'))return'batches';
 if(name.includes('сборк')||name.includes('build'))return'builds';
 if(name.includes('касс')||name.includes('счет')||name.includes('счёт')||name.includes('account'))return'accounts';
 if(name.includes('задач')||name.includes('task'))return'tasks';
 if(name.includes('транзакц')||name.includes('операц')||name.includes('доход')||name.includes('расход')||name.includes('transaction'))return'tx';
 if(h.includes('начальныйостаток')&&(h.includes('касса')||h.includes('счет')||h.includes('счёт')))return'accounts';
 if(h.includes('квадрант')&&h.some(x=>['задача','текстзадачи','task'].includes(x)))return'tasks';
 if(h.includes('сумма')||h.includes('amount')||h.includes('типоперации'))return'tx';
 if(h.includes('номерсборки')||h.includes('статус'))return'builds';
 if(h.includes('тип')&&h.includes('описание')&&h.includes('колво'))return'batches';
 return'skip';
}

function normalizeLocalTelegramBase(value){
 try{
  const url=new URL(String(value||'').trim()),host=url.hostname.replace(/^\[|\]$/g,'').toLowerCase();
  if(url.protocol!=='http:'||!['localhost','127.0.0.1','::1'].includes(host)||url.username||url.password||url.pathname!=='/'||url.search||url.hash)return '';
  return url.origin;
 }catch{return ''}
}
async function localTelegramRequest(path,options={}){
 const base=options.baseUrl||TELEGRAM_UI.baseUrl,headers={};
 if(options.token)headers.Authorization='Bearer '+options.token;
 if(options.body!==undefined)headers['Content-Type']='application/json';
 const timeoutMs=options.timeoutMs===undefined?30_000:options.timeoutMs;
 if(!Number.isSafeInteger(timeoutMs)||timeoutMs<1||timeoutMs>120_000)throw new RangeError('Тайм-аут локального API должен быть от 1 до 120000 мс.');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
 let response,payload=null;
 try{
  response=await fetch(base+path,{method:options.method||'GET',headers,body:options.body,signal:controller.signal,credentials:'include',cache:'no-store',redirect:'error',referrerPolicy:'no-referrer'});
  try{payload=await response.json()}catch(error){
   if(controller.signal.aborted)throw error;
  }
 }catch(cause){
  const error=new Error(controller.signal.aborted?'Локальный сервис не ответил за отведённое время.':'Локальный сервис недоступен или сессия не может быть использована.');
  error.code=controller.signal.aborted?'BUILD_BOOK_LOCAL_API_TIMEOUT':'BUILD_BOOK_LOCAL_API_UNAVAILABLE';
  error.cause=cause;
  throw error;
 }finally{clearTimeout(timer)}
 if(!response.ok){const error=new Error(typeof payload?.error==='string'?payload.error:'Локальный сервис вернул ошибку.');error.status=response.status;error.code=typeof payload?.code==='string'?payload.code:response.status===401?'BUILD_BOOK_LOCAL_API_UNAUTHORIZED':response.status===409?'BUILD_BOOK_STORAGE_CONFLICT':'BUILD_BOOK_LOCAL_API_ERROR';throw error}
 return payload||{};
}

async function refreshTelegramStatus(silent=false){
 if(TELEGRAM_UI.checking)return;
 TELEGRAM_UI.checking=true;TELEGRAM_UI.error='';
 try{
  const [status,diagnostics,activity,recovery]=await Promise.all([
   localTelegramRequest('/api/telegram/status'),
   localTelegramRequest('/api/diagnostics'),
   localTelegramRequest('/api/telegram/messages'),
   localTelegramRequest('/api/host/recovery')
  ]);
  if(!status||typeof status.enabled!=='boolean'||typeof status.configured!=='boolean'||typeof status.running!=='boolean')throw new Error('Некорректный статус локального сервиса.');
  if(!diagnostics||typeof diagnostics.ok!=='boolean')throw new Error('Не удалось получить диагностику локального хоста.');
  if(!activity||!Array.isArray(activity.messages))throw new Error('Некорректный журнал сообщений Telegram.');
  if(!recovery||typeof recovery.supported!=='boolean'||typeof recovery.installed!=='boolean')throw new Error('Некорректный статус автовосстановления.');
  let profile={bot:null};
  if(status.configured){try{profile=await localTelegramRequest('/api/telegram/bot/profile')}catch{profile={bot:null,error:'Не удалось подтвердить токен через Telegram Bot API.'}}}
  TELEGRAM_UI.connected=true;TELEGRAM_UI.status=status;TELEGRAM_UI.diagnostics=diagnostics;TELEGRAM_UI.messages=activity.messages;TELEGRAM_UI.botProfile=profile?.bot||null;TELEGRAM_UI.botProfileError=profile?.error||'';TELEGRAM_UI.recovery=recovery;
 }catch(error){
  TELEGRAM_UI.connected=false;TELEGRAM_UI.status=null;TELEGRAM_UI.diagnostics=null;TELEGRAM_UI.messages=[];TELEGRAM_UI.botProfile=null;TELEGRAM_UI.botProfileError='';TELEGRAM_UI.recovery=null;
  TELEGRAM_UI.error=error.status===401?'Сессия не подключена или истекла.':'Локальный API недоступен. Запустите хост и проверьте адрес.';
  if(STORAGE_MODE==='canonical'&&(error.status===401||error.code==='BUILD_BOOK_LOCAL_API_UNAVAILABLE')){
   APP_FATAL_ERROR=new Error(error.status===401?'Сессия локального хранилища истекла. Скачайте резервную копию текущего состояния и подключите хост заново.':'Локальный хост недоступен. Работа остановлена до восстановления соединения; скачайте резервную копию текущего состояния.');
   render();
  }
 }finally{
  TELEGRAM_UI.checking=false;TELEGRAM_UI.checked=true;TELEGRAM_UI.checkedAt=Date.now();
  if(!silent&&V.tab==='telegram')render();
 }
}

const input=f.elements.query,results=f.querySelector('#gsearch-results'),count=f.querySelector('#gsearch-count');
const norm=value=>String(value??'').normalize('NFKC').toLocaleLowerCase('ru-RU').trim();

function formatStorageSize(value){
 const n=Number(value);
 if(!Number.isFinite(n)||n<0)return'—';
 if(n<1024)return Math.round(n)+' Б';
 const units=['КБ','МБ','ГБ','ТБ'];let amount=n/1024,unit=0;
 while(amount>=1024&&unit<units.length-1){amount/=1024;unit++}
 return amount.toFixed(amount>=10?1:2)+' '+units[unit];
}
async function refreshStorageInfo(){
 const out=$('#storage-info');if(!out)return;
 out.textContent='Получаем сведения о хранилище…';
 if(!navigator.storage||!navigator.storage.estimate){
  out.textContent='Браузер не предоставляет оценку занятого места.';
  return;
 }
 try{
  const tasks=[navigator.storage.estimate()];
  tasks.push(navigator.storage.persisted?navigator.storage.persisted().catch(()=>null):Promise.resolve(null));
  const [estimate,persisted]=await Promise.all(tasks);
  if(!out.isConnected)return;
  const usage=Number(estimate&&estimate.usage)||0,quota=Number(estimate&&estimate.quota)||0;
  const ratio=quota>0?Math.min(100,Math.max(0,usage/quota*100)):null;
  const place=quota>0?'Занято примерно '+formatStorageSize(usage)+' из '+formatStorageSize(quota)+(ratio!==null?' ('+ratio.toFixed(1)+'%)':'')+'. ':'Занято примерно '+formatStorageSize(usage)+'. ';
  const durable=persisted===true?'Постоянное хранение разрешено.':persisted===false?'Постоянное хранение не подтверждено: браузер может очистить данные при нехватке места.':'Статус постоянного хранения не сообщается браузером.';
  out.textContent=place+durable+' Оценка относится ко всему сайту в этом браузере.';
 }catch(error){
  if(out.isConnected)out.textContent='Не удалось получить сведения о хранилище: '+(error&&error.message||'ошибка браузера');
 }
}
async function requestPersistentStorage(){
 if(!navigator.storage||!navigator.storage.persist){alert('Этот браузер не поддерживает запрос постоянного хранения.');return}
 try{
  const granted=await navigator.storage.persist();
  toast(granted?'Постоянное хранение разрешено браузером.':'Браузер не выдал разрешение на постоянное хранение.');
 }catch(error){alert('Не удалось запросить постоянное хранение: '+(error.message||'ошибка'))}
 await refreshStorageInfo();
}

function restoreTrashItem(id){
 const item=(S.trash||[]).find(x=>x.id==id);
 if(!item){alert('Запись не найдена в корзине.');return false}
 const record=item.record||{},related=item.relatedTx||null;
 const txConflict=()=>related&&S.tx.some(x=>x.id===related.id);
 const restoreRelated=()=>{if(related)S.tx.push(activateTrashRecord(related))};
 const fail=message=>{alert(message);return false};
 if(related){const cashCheck=checkTransactionBalance(activateTrashRecord(related));if(!cashCheck.ok)return fail(cashCheck.error+' Связанная запись осталась в корзине.')}
 if(item.type==='batch'){
  if(S.batches.some(x=>x.id===record.id))return fail('Партия с таким ID уже существует. Восстановление остановлено.');
  if(txConflict())return fail('Связанная операция уже существует. Сначала устраните конфликт ID.');
  const q=Math.max(0,+record.qty||0),off=Math.max(0,+record.writtenOffQty||0),bad=Math.max(0,+record.problemQty||0);
  if(usedGood(record)>Math.max(0,q-off-bad)||usedProblem(record)>bad)return fail('Существующие сборки уже ссылаются на эту партию, а количества недостаточно. Запись осталась в корзине.');
  S.batches.push(activateTrashRecord(record));
  restoreRelated();
 }else if(item.type==='build'){
  if(S.builds.some(x=>x.id===record.id))return fail('Сборка с таким ID уже существует. Восстановление остановлено.');
  if(txConflict())return fail('Связанная операция уже существует. Сначала устраните конфликт ID.');
  const pending={normal:{},problem:{}};
  for(const line of record.lines||[]){
   const batch=find('batches',line.batchId),qty=+line.qty,problem=!!line.problem;
   if(!batch)return fail('Не найдена партия '+line.batchId+'. Сначала восстановите комплектующие.');
   if(!Number.isInteger(qty)||qty<1)return fail('В составе сборки обнаружено некорректное количество.');
   const key=String(batch.id),bucket=problem?'problem':'normal';
   pending[bucket][key]=(pending[bucket][key]||0)+qty;
   const available=problem?problemAvailable(batch):goodAvailable(batch);
   if(pending[bucket][key]>available)return fail('Не хватает '+(problem?'проблемных':'нормальных')+' деталей «'+batch.desc+'». Сборка осталась в корзине.');
  }
  S.builds.push(activateTrashRecord(record));
  restoreRelated();
  if(Array.isArray(item.photos)&&item.photos.length)PH[record.id]=trashClone(item.photos);
 }else if(item.type==='task'||item.type==='checklist'){
  const collection=item.type==='task'?'tasks':'checklist';
  if(S[collection].some(x=>x.id===record.id))return fail('Запись с таким ID уже существует.');
  S[collection].push(activateTrashRecord(record));
 }else if(item.type==='tx'){
  if(S.tx.some(x=>x.id===record.id))return fail('Операция с таким ID уже существует.');
  const cashCheck=checkTransactionBalance(activateTrashRecord(record));if(!cashCheck.ok)return fail(cashCheck.error+' Операция осталась в корзине.');
  if(record.kitPurchase){
   const kitBatches=Array.isArray(item.kitBatches)?item.kitBatches:[];
   if(kitBatches.length!==(record.kitBatchIds||[]).length)return fail('В корзине отсутствует часть комплектующих этой покупки. Восстановление остановлено.');
   if(kitBatches.some(batch=>S.batches.some(existing=>existing.id===batch.id)))return fail('Одна из комплектующих уже существует на складе. Сначала устраните конфликт ID.');
   const expected=new Set(record.kitBatchIds||[]);
   if(kitBatches.some(batch=>!expected.has(batch.id)||batch.kitPurchaseId!==record.id))return fail('Связи комплектующих в корзине повреждены. Восстановление остановлено.');
   S.batches.push(...kitBatches.map(activateTrashRecord));
  }else if(record.partSale){
   const state=item.restoreState,batch=state&&state.batch&&find('batches',state.batch.id);
   if(!state||!batch)return fail('Нельзя восстановить продажу: отсутствуют контрольные данные или исходная партия.');
   const current={qty:+batch.qty||0,problemQty:+batch.problemQty||0};
   if(current.qty!==state.batch.after.qty||current.problemQty!==state.batch.after.problemQty)return fail('Остаток партии изменился после удаления продажи. Для защиты учёта восстановление заблокировано.');
   let build=null;
   if(state.build){
    build=find('builds',state.build.id);
    if(!build||build.status!==state.build.status||JSON.stringify(build.lines||[])!==JSON.stringify(state.build.afterLines))return fail('Состав или статус исходной сборки изменился. Продажу нельзя безопасно восстановить.');
   }
   batch.qty=state.batch.before.qty;
   batch.problemQty=state.batch.before.problemQty;
   if(build)build.lines=trashClone(state.build.beforeLines);
  }
  S.tx.push(activateTrashRecord(record));
 }else return fail('Неизвестный тип записи в корзине.');
 S.trash=S.trash.filter(x=>x.id!==item.id);
 save();render();toast('Запись восстановлена');
 return true;
}

function renameCategory(kind,group,oldName){

  if(kind==='e'&&group===S.stockGroup)S.batches.forEach(batch=>{if(batch.type===oldName)batch.type=nextName});

 });

async function initializeCanonicalStorage(){
 if(STORAGE_MODE!=='canonical')return;

  TELEGRAM_UI.baseUrl=location.origin;
  await localTelegramRequest('/api/session/bootstrap-local',{method:'POST',body:'{}',timeoutMs:8000});
  await refreshTelegramStatus(true);
 }
 const runtimeModule=await import('./client/canonical-profile-runtime.mjs');
 canonicalRuntime=runtimeModule.createCanonicalProfileRuntime({baseUrl:location.origin});
 await canonicalRuntime.verifySession();
 repository=canonicalRuntime.repository;
 storageChannel=null;
 const canonical=await repository.readProfile();
 if(!canonical.state)throw new Error('Файловый профиль локального хоста пуст. Сначала вернитесь в IndexedDB, подключите локальный хост и импортируйте резервную копию профиля в настройках.');
}

  if(navigator.storage&&navigator.storage.persist&&STORAGE_MODE==='indexeddb')navigator.storage.persist().catch(()=>{});
  return true;
 }catch(error){
  APP_FATAL_ERROR=error;
  console.error('Buildbook startup:',error);
  render();
  return false;
 }
})();
