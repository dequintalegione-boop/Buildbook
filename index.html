let tm;const save=()=>{const cur=JSON.stringify(S);if(cur!=last&&!save.skip){LOG.unshift({t:new Date().toLocaleString('ru-RU'),l:lbl(last,cur),s:last});LOG=LOG.slice(0,40)}last=cur;save.skip=0;clearTimeout(tm);tm=setTimeout(async()=>{try{const d=await idb(),w=d.transaction('kv','readwrite').objectStore('kv');w.put(S,'s');w.put(LOG,'l');w.put(PH,'p')}catch(e){}},150)};

 S.stockEvents=Array.isArray(S.stockEvents)?S.stockEvents:[];
 (S.batches||[]).forEach(b=>{

  delete b.problem;delete b.reason;
 });
 (S.builds||[]).forEach(build=>(build.lines||[]).forEach(line=>{line.problem=!!line.problem}));
}
const live=x=>x.lines.reduce((n,l)=>{const b=S.batches.find(b=>b.id==l.batchId);return n+(b?b.price*l.qty:0)},0),cost=x=>x.status==ST[3]&&x.cost!=null?x.cost:live(x);
const sale=b=>b.price||b.planned||0,profit=b=>sale(b)-cost(b),bal=a=>a.open+S.tx.reduce((n,t)=>n+(t.acc==a.id?(t.kind=='i'?t.amount:t.kind=='e'?-t.amount:0):0)+(t.kind=='transfer'&&t.toAcc==a.id?+t.amount:0)-(t.kind=='transfer'&&t.fromAcc==a.id?+t.amount:0),0);

function problemForm(id){

prepared.forEach(x=>{if(!grouped[x.g])grouped[x.g]=[];if(x.t.cat&&!grouped[x.g].includes(x.t.cat))grouped[x.g].push(x.t.cat)});

const total=monthly.reduce((n,v)=>n+v,0);
return {category:cat,monthly,total,average:total/12};
});
const monthly=Array.from({length:12},(_,i)=>rows.reduce((n,r)=>n+r.monthly[i],0));

return {name:name,rows:rows,monthly:monthly,total:total,average:total/12};
});
const monthly=Array.from({length:12},(_,i)=>groups.reduce((n,g)=>n+g.monthly[i],0));
const total=monthly.reduce((n,v)=>n+v,0);

function globalSearch(){
const body='<p class="gsearch-help">Поиск по комплектующим, сборкам, операциям и задачам. Нажмите Ctrl+K, чтобы открыть поиск из любого раздела.</p><input name="query" type="search" autocomplete="off" placeholder="Введите название, категорию, описание или текст задачи"><div id="gsearch-count" class="gsearch-help">Введите минимум 2 символа</div><div id="gsearch-results" class="gsearch-results"></div>';

const input=f.elements.query,results=f.querySelector('#gsearch-results'),count=f.querySelector('#gsearch-count');
const norm=value=>String(value??'').normalize('NFKC').toLocaleLowerCase('ru-RU').trim();
const update=()=>{

if(q.length<2){count.textContent='Введите минимум 2 символа';return}
const matches=[];

};

};
input.addEventListener('input',update);
