<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buildbook — тесты</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#182124;background:#f2f5f5}body{max-width:1000px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #d6dfdf;border-radius:12px;padding:18px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#637275}.pass{color:#087c42}.fail{color:#bd3434}li{padding:5px 0;border-bottom:1px solid #edf0f0}.badge{padding:2px 9px;border-radius:20px;background:#e8eeee}iframe{width:100%;height:640px;border:1px solid #cbd5d5;border-radius:10px;background:white}button{font:inherit;padding:8px 14px;border:1px solid #0c766d;border-radius:8px;background:#0c766d;color:white;cursor:pointer}#app-wrap{display:none}code{background:#edf0f0;padding:2px 5px;border-radius:4px}

<h1>Buildbook — автоматические браузерные тесты</h1>
<p class="muted">Проверяется выбранная версия приложения в отдельной базе IndexedDB <code>buildbook-test</code>. Обычные данные Buildbook не затрагиваются.</p>
<div class="card row"><div><b id="summary">Ожидание запуска…</b><div class="muted" id="details">Тесты выполняются локально в этом браузере.</div></div><button id="rerun">Запустить снова</button></div>
<div class="card"><ol id="results"></ol></div>
<div id="app-wrap"><iframe id="app" title="Тестируемое приложение" src="about:blank"></iframe></div>
<script>
(function(){
'use strict';
const frame=document.getElementById('app'),results=document.getElementById('results'),summary=document.getElementById('summary'),details=document.getElementById('details'),button=document.getElementById('rerun');
const RUNNER_BROWSER=new URLSearchParams(location.search).get('browser')||'auto';
const APP_VARIANT=new URLSearchParams(location.search).get('app')==='standalone'?'standalone':'index';
frame.src=APP_VARIANT==='standalone'?'../Buildbook-standalone.html?test=1':'../index.html?test=1';
let w,api,passed=0,failed=0,alerts=[],prompts=[],transferId=null,transferBaseline=null,moneyStockBaseline=null,tempDatabaseCounter=0;
const tempDatabaseName=prefix=>'buildbook-repository-tests';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function assert(ok,msg){if(!ok)throw new Error(msg||'Условие не выполнено')}
function report(name,ok,detail){const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'✓ ':'✗ ')+name+(detail?' — '+detail:'');results.append(li);if(ok)passed++;else failed++;summary.textContent='Пройдено: '+passed+' · Ошибок: '+failed;details.textContent='Движок: '+RUNNER_BROWSER+' · приложение: '+APP_VARIANT+' · выполнено тестов: '+(passed+failed)}
async function test(name,fn){summary.textContent='Выполняется: '+name;try{if(w)w.document.querySelectorAll('.ov').forEach(overlay=>overlay.remove());await fn();report(name,true)}catch(e){report(name,false,e&&e.message||String(e));console.error(name,e)}}
const fixture=()=>({
accounts:[{id:'cash',name:'Наличные',open:1000},{id:'card',name:'Карта',open:0}],
stockEvents:[],batches:[
{id:'gpu-batch',type:'Видеокарты',desc:'Тестовая видеокарта',date:'2026-01-10',price:100,qty:10,problemQty:0,problemReason:'',writtenOffQty:0,supplier:'Поставщик'},
{id:'ssd-batch',type:'ССД',desc:'Тестовый SSD',date:'2026-01-11',price:50,qty:2,problemQty:0,problemReason:'',writtenOffQty:0}
],
builds:[{id:'build-open',num:1,name:'Тестовая сборка',status:'Собирается',builder:'Тест',buyer:'',date:'2026-01-12',sold:'',planned:0,price:0,note:'',lines:[{batchId:'gpu-batch',qty:4,problem:false}]}],
tx:[],seq:1,tasks:[],checklist:[],notes:'',stockGroup:'Сборка ПК',partSaleGroup:'Продажи',partSaleCategory:'Комплектующие',
categories:{
e:{'Сборка ПК':['Видеокарты','Процессоры','Мат платы','Оперативка','ССД','БП','Башни','Корпусы','Вентиляторы','Периферия','Прочее','Компы и другое'],'ЧП':['ДТП','Проебы','Штрафы','Другое'],'Продажи и продвижение':['Авито','Продвижение','Реклама','Накрутка','Другое'],'Ремонт и обслуживание':['Строй материалы','Инструменты','Другое'],'Общие расходы':['Передвижение','Еда','Жижи общак','Развлечения','Другое'],'Транспорт':['Бензин','Ремонт Автомобиля','Масло','Авто другое']},
i:{'Заработок':['Заработная плата','Сборка ПК','Другое'],'Продажи':['Комплектующие']}},
hiddenCategories:{e:[],i:[]},hiddenGroups:{e:[],i:[]},
set:{theme:'light',year:2026,backup:'',dash:null,per:'m',demoLoaded:false}
});
function state(){return api.getState()}
function form(){return [...w.document.querySelectorAll('.ov form')].at(-1)||null}
function submit(f){assert(f&&typeof f.onsubmit==='function','Форма не найдена');f.onsubmit({preventDefault:function(){}})}
function click(selector){const el=w.document.querySelector(selector);assert(el,'Не найден элемент '+selector);el.click();return el}
function setv(f,name,value){assert(f.elements[name],'Поле формы не найдено: '+name);f.elements[name].value=value}
async function boot(){
summary.dataset.finished='false';
results.innerHTML='';passed=failed=0;alerts=[];prompts=[];
summary.textContent='Подготовка…';details.textContent='Загружается тестовая версия приложения.';
for(let i=0;i<150&&!frame.contentWindow.__BUILD_BOOK_TEST__;i++)await sleep(100);
w=frame.contentWindow;api=w.__BUILD_BOOK_TEST__;assert(api,'Тестовый API недоступен. Откройте runner на том же origin, что и приложение.');await Promise.race([api.ready(),sleep(20000).then(()=>{throw new Error('Приложение не завершило запуск. Этап: '+(api.startupStage?api.startupStage():'неизвестен'))})]);
w.alert=m=>alerts.push(String(m));w.confirm=()=>true;w.prompt=(m,d)=>prompts.length?prompts.shift():d||'';
api.setState(fixture());await sleep(350);
await test('Тестовый режим использует отдельную IndexedDB',()=>assert(api.database==='buildbook-test','Используется не изолированная база'));
await test('Очистка хранилища удаляет профиль и сбрасывает техническую ревизию',async()=>{
const repository=w.BuildbookRepository.create(tempDatabaseName('buildbook-clear'));
await repository.clear();
try{
await repository.writeProfile({marker:'Временные данные'},[{id:'temporary'}],{},0);
await repository.clear();
const empty=await repository.readProfile();
assert(empty.state===undefined&&empty.logs===undefined&&empty.photos===undefined,'Очистка оставила записи профиля');
assert(empty.revision===0,'Очистка не сбросила техническую ревизию');
}finally{await repository.clear();await repository.close()}
});
await test('Сохранение повышает ревизию профиля атомарно',async()=>{
const name=tempDatabaseName('buildbook-revision'),repository=w.BuildbookRepository.create(name);
await repository.clear();
try{
const initial=await repository.readProfile();
assert(initial.revision===0,'Пустой профиль должен начинать с ревизии 0');
const revision=await repository.writeProfile({marker:'Версия 1'},[],{},initial.revision);
assert(revision===1,'Первая запись должна увеличить ревизию до 1');
const loaded=await repository.readProfile();
assert(loaded.revision===1&&loaded.state.marker==='Версия 1','Ревизия или состояние не сохранились');
}finally{await repository.clear();await repository.close()}
});
await test('Устаревшая вкладка не перезаписывает более свежий профиль',async()=>{
const name=tempDatabaseName('buildbook-stale-tab'),first=w.BuildbookRepository.create(name),second=w.BuildbookRepository.create(name);
await first.clear();
try{
const a=await first.readProfile(),b=await second.readProfile();
await first.writeProfile({marker:'Изменение вкладки A'},[{id:'A'}],{},a.revision);
let conflict=null;
try{await second.writeProfile({marker:'Старое состояние вкладки B'},[{id:'B'}],{},b.revision)}catch(error){conflict=error}
assert(conflict&&conflict.code==='BUILD_BOOK_STORAGE_CONFLICT','Запись устаревшей вкладки не была заблокирована');
const actual=await second.readProfile();
assert(actual.revision===1&&actual.state.marker==='Изменение вкладки A','Старая вкладка перезаписала более свежие данные');
assert(actual.logs[0].id==='A','Журнал более свежего профиля был потерян');
}finally{await first.clear();await Promise.all([first.close(),second.close()])}
});
await test('Одновременные вкладки не могут сохранить один и тот же номер ревизии',async()=>{
const name=tempDatabaseName('buildbook-race'),first=w.BuildbookRepository.create(name),second=w.BuildbookRepository.create(name);
await first.clear();
try{
const [a,b]=await Promise.all([first.readProfile(),second.readProfile()]);
const results=await Promise.allSettled([
first.writeProfile({writer:'A'},[{writer:'A'}],{},a.revision),
second.writeProfile({writer:'B'},[{writer:'B'}],{},b.revision)
]);
assert(results.filter(x=>x.status==='fulfilled').length===1,'Должна пройти ровно одна конкурирующая запись');
const rejected=results.find(x=>x.status==='rejected');
assert(rejected&&rejected.reason.code==='BUILD_BOOK_STORAGE_CONFLICT','Вторая запись должна получить конфликт ревизии');
const actual=await first.readProfile();
assert(actual.revision===1,'Параллельные операции некорректно изменили ревизию');
assert(['A','B'].includes(actual.state.writer),'В базе нет ни одной из успешно записанных версий');
}finally{await first.clear();await Promise.all([first.close(),second.close()])}
});

await test('Закрытие нескольких подключений освобождает соединения для повторного открытия',async()=>{
const name=tempDatabaseName('buildbook-close-connections'),first=w.BuildbookRepository.create(name),second=w.BuildbookRepository.create(name);
await first.clear();
await Promise.all([first.readProfile(),second.readProfile()]);
await Promise.all([first.close(),second.close()]);
const reopened=w.BuildbookRepository.create(name);
try{assert((await reopened.readProfile()).revision===0,'После закрытия нельзя повторно открыть очищенную базу')}
finally{await reopened.clear();await reopened.close()}
});
await test('Большой профиль сохраняется без потери данных',async()=>{
const name=tempDatabaseName('buildbook-large-profile'),repository=w.BuildbookRepository.create(name);
await repository.clear();
summary.textContent='Выполняется: Профиль — подготовка данных';
try{
const isWebKit=RUNNER_BROWSER==='webkit'||(RUNNER_BROWSER==='auto'&&/AppleWebKit/i.test(w.navigator.userAgent)&&!/(Chrome|Chromium|CriOS|Edg)/i.test(w.navigator.userAgent));
const textRepeat=isWebKit?16:1024*1024,photoSize=isWebKit?0:3*1024*1024;
const recordCount=isWebKit?1:500;
const largeText='Buildbook'.repeat(textRepeat),bytes=new Uint8Array(photoSize);bytes.fill(37);
const photo=isWebKit?null:new w.Blob([bytes],{type:'image/webp'});
summary.textContent='Выполняется: Профиль — запись в IndexedDB';
const revision=await repository.writeProfile({notes:largeText,records:Array.from({length:recordCount},(_,i)=>({id:'row-'+i,value:i}))},[{id:'large-log',text:'Журнал большого профиля'}],photo?{buildLarge:[photo]}:{},0);
summary.textContent='Выполняется: Профиль — чтение из IndexedDB';
const stored=await repository.readProfile();
summary.textContent='Выполняется: Профиль — проверка данных';
assert(revision===1&&stored.revision===1,'Не обновилась ревизия крупного профиля');
assert(stored.state.notes.length===largeText.length&&stored.state.notes.slice(0,80)===largeText.slice(0,80)&&stored.state.notes.slice(-80)===largeText.slice(-80),'Большое текстовое поле повреждено');
assert(stored.state.records.length===recordCount&&stored.state.records[recordCount-1].id==='row-'+(recordCount-1),'Потерялись строки записи');
assert(stored.logs[0].text==='Журнал большого профиля','Не сохранился журнал профиля');
if(!isWebKit){
 const savedPhoto=stored.photos.buildLarge[0],savedBytes=new Uint8Array(await savedPhoto.arrayBuffer());
 assert(savedPhoto instanceof w.Blob&&savedPhoto.size===photoSize&&savedPhoto.type==='image/webp','Фотография потерялась или изменила формат');
 assert(savedBytes[0]===37&&savedBytes[savedBytes.length-1]===37,'Байты фотографии изменились при сохранении');
 assert(largeText.length+photoSize>10*1024*1024,'Профиль Chromium/Firefox должен превышать 10 МБ');
}else assert(largeText.length>100,'Контрольный профиль WebKit неожиданно пустой');
}finally{await repository.clear();await repository.close()}
});

await test('Слой хранения читает состояние, журнал и фотографии',async()=>{
const name=tempDatabaseName('buildbook-storage-test'),repository=w.BuildbookRepository.create(name);
await repository.clear();
try{
summary.textContent='Выполняется: Blob repository — подготовка';
const photo=new w.Blob(['Buildbook photo'],{type:'image/png'});
summary.textContent='Выполняется: Blob repository — чтение байтов FileReader';
const photoBytes=await Promise.race([
 new Promise((resolve,reject)=>{
  const reader=new w.FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error||new Error('FileReader не смог прочитать Blob'));
  reader.onabort=()=>reject(new Error('Чтение Blob через FileReader отменено'));
  reader.readAsArrayBuffer(photo);
 }),
 sleep(10000).then(()=>{throw new Error('FileReader не завершил чтение Blob за 10 секунд')})
]);
assert(photoBytes instanceof w.ArrayBuffer&&photoBytes.byteLength===15,'FileReader вернул некорректный размер бинарных данных');
summary.textContent='Выполняется: Blob repository — запись через ArrayBuffer';
await repository.writeProfile({marker:'Состояние'},[{id:'journal-entry'}],{build1:[{__buildbookBlob:1,type:photo.type,bytes:photoBytes}]},0);
summary.textContent='Выполняется: Blob repository — чтение';
const stored=await repository.readProfile();
summary.textContent='Выполняется: Blob repository — проверка';
assert(stored.state.marker==='Состояние','Не прочитано состояние профиля');
assert(stored.logs[0].id==='journal-entry','Не прочитан журнал');
assert(stored.photos.build1[0].__buildbookBlob===1&&stored.photos.build1[0].bytes instanceof w.ArrayBuffer&&stored.photos.build1[0].bytes.byteLength===photoBytes.byteLength,'Фотография не сохранена как бинарный ArrayBuffer');
assert((await repository.read('s')).marker==='Состояние','Отдельное чтение записи профиля не работает');
}finally{await repository.clear();await repository.close()}
});
await test('Слой хранения откатывает частичную запись при ошибке',async()=>{
const name=tempDatabaseName('buildbook-storage-atomic'),repository=w.BuildbookRepository.create(name);
await repository.clear();
try{
await repository.writeProfile({marker:'До ошибки'},[{id:'old-log'}],{},0);
let rejected=false;
try{await repository.writeProfile({marker:'После ошибки'},[{invalid:()=>true}],{},1)}catch(error){rejected=true}
assert(rejected,'Ошибка клонирования не была обработана');
const stored=await repository.readProfile();
assert(stored.state.marker==='До ошибки'&&stored.logs[0].id==='old-log','Часть неудачной записи попала в базу');
}finally{await repository.clear();await repository.close()}
});
await test('Старые данные автоматически мигрируют в текущую схему',()=>{
const legacy={batches:[{id:'legacy-batch',qty:7,price:120}],builds:[],tx:[],notes:'Сохранённая заметка',categories:{e:{'Склад':['Видеокарта']},i:{'Продажи':['Комплектующие']}}};
const result=api.migrateState(legacy),migrated=result.state;
assert(result.migrated,'Миграция старой версии не запущена');
assert(migrated.schemaVersion===api.schemaVersion&&api.schemaVersion===5,'Не записана текущая версия схемы 5');
assert(migrated.batches.length===1&&migrated.batches[0].id==='legacy-batch','Потеряна существующая складская партия');
assert(migrated.batches[0].qty===7&&migrated.batches[0].price===120,'Изменились исходные значения партии');
assert(migrated.notes==='Сохранённая заметка','Потеряны заметки');
assert(Array.isArray(migrated.trash)&&Array.isArray(migrated.stockEvents)&&Array.isArray(migrated.tasks)&&Array.isArray(migrated.checklist),'Не добавлены новые обязательные списки');
assert(Array.isArray(migrated.accounts)&&migrated.accounts.length===2,'Не восстановлены значения касс по умолчанию');
assert(legacy.schemaVersion===undefined,'Миграция изменила исходный объект');
});
await test('Миграция одной и той же базы идемпотентна',()=>{
const first=api.migrateState({batches:[],builds:[],tx:[],tasks:[]});
const second=api.migrateState(first.state);
assert(first.migrated,'Первичная миграция не выполнена');
assert(!second.migrated,'Повторная миграция не должна запускаться');
assert(second.state.schemaVersion===api.schemaVersion,'Версия схемы изменилась при повторном запуске');
});
await test('Приложение не открывает данные от более новой схемы',()=>{
let rejected=false;
try{api.migrateState({schemaVersion:api.schemaVersion+1,batches:[],builds:[],tx:[],tasks:[]})}
catch(error){rejected=String(error.message).includes('более новой версией')}
assert(rejected,'Будущая версия схемы не была заблокирована');
});
await test('Миграция отклоняет повреждённый корневой формат',()=>{
let rejected=false;
try{api.migrateState('повреждённый профиль')}catch(error){rejected=String(error.message).includes('неверный формат')}
assert(rejected,'Некорректный профиль был молча заменён пустыми значениями');
});
await test('Импорт бэкапа блокирует данные от более новой схемы',()=>{
api.setState(fixture());
const before=state();
let rejected=false;
try{api.restoreBackup({...fixture(),schemaVersion:api.schemaVersion+1},'replace',false)}
catch(error){rejected=String(error.message).includes('резервную копию')}
assert(rejected,'Бэкап будущей схемы был принят старой версией');
assert(JSON.stringify(state())===JSON.stringify(before),'Состояние изменилось после отклонённого бэкапа');
});
await test('Мигрированная схема сохраняется в IndexedDB',async()=>{
await api.flushStorage();
assert(await api.persistedSchema()===api.schemaVersion,'В IndexedDB не записана актуальная версия схемы');
});
await test('Все основные разделы открываются',()=>{
for(const tab of ['home','dash','stock','builds','tx','tasks','trash','log','set']){api.action('nav',tab);assert(w.document.querySelector('#m h1'), 'Пустой экран в разделе '+tab)}
});
await test('Склад считает доступное количество с учётом сборки',()=>{

api.openSale();const f=form();f.querySelector('[name="pick-0"]').checked=true;setv(f,'qty-0','99');setv(f,'price-0','150');submit(f);assert(alerts.some(x=>x.includes('Проверьте количество')),'Не показана ошибка количества');assert(form()===f,'Форма закрылась после ошибочной продажи');assert(api.getState().batches[0].qty===10,'Склад изменился при ошибке');

await test('Множественная продажа записывает индивидуальные цены и себестоимость',()=>{
api.openSale();const f=form();[[0,2,150],[1,1,70],[2,2,180]].forEach(([i,q,p])=>{f.querySelector('[name="pick-'+i+'"]').checked=true;setv(f,'qty-'+i,String(q));setv(f,'price-'+i,String(p))});submit(f);
const s=state(),sales=s.tx.filter(t=>t.partSale);assert(sales.length===3,'Ожидалось 3 отдельные записи, получено '+sales.length);assert(sales.map(x=>x.amount).reduce((a,b)=>a+b,0)===730,'Выручка должна быть 730 ₽');assert(sales.map(x=>x.costAmount).reduce((a,b)=>a+b,0)===450,'Себестоимость должна быть 450 ₽');assert(sales.map(x=>x.grossProfit).reduce((a,b)=>a+b,0)===280,'Валовая прибыль должна быть 280 ₽');assert(sales.some(t=>t.unitPrice===150)&&sales.some(t=>t.unitPrice===70)&&sales.some(t=>t.unitPrice===180),'Не сохранены цены по каждой позиции');
});
