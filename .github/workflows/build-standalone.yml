name: Build standalone bundle

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    name: Refresh standalone HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone HTML
        run: node scripts/build-standalone.mjs

      - name: Commit generated bundle when it changed
        run: |
          if git diff --quiet -- Buildbook-standalone.html; then
            echo "Standalone bundle is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Buildbook-standalone.html
          git commit -m "build: refresh standalone HTML bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
