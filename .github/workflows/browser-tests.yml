name: Browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildbook-browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-storage-tests:
    name: Local host storage unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run local host, Telegram and API unit tests
        run: node --test tests/*.test.mjs

  browser-tests:
    name: Buildbook ${{ matrix.app }} / ${{ matrix.browser }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
        app: [index, standalone]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (только для тестов)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build autonomous HTML bundle
        run: node scripts/build-standalone.mjs

      - name: Run application and browser suite
        env:
          BROWSER: ${{ matrix.browser }}
          APP_VARIANT: ${{ matrix.app }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/buildbook-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/test-runner.html > /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/run-browser.mjs
